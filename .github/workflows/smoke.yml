name: smoke
# Post-merge check of production. Cloudflare Workers Builds deploys every push
# to main (docs/deploy-cloudflare.md), so after a merge this waits for that
# deploy and then asks /healthz for a 200 whose `commit` is the merged commit.
# A red run means prod stopped answering (roll back: docs/deploy-cloudflare.md,
# Rollback) or the merge never reached prod: a failed build leaves the previous
# version answering with the previous commit.
#
# The URL comes from the repository variable PRODUCTION_URL (Settings ›
# Variables), https://voxfordofficial.com since ticket G. Until it is set the
# job says so and passes: there is nothing deployed to check yet.
#
# Once the merge is live, the IndexNow step tells Bing, Yandex and the other
# IndexNow engines which pages changed (spec › SEO/GEO: IndexNow ping on deploy).
# A push sends the sitemap URLs whose lastmod is the merged commit's date or
# later; a manual run (Actions › smoke › Run workflow) sends every URL, e.g.
# after the domain changed. The key is public by design: IndexNow checks it
# against public/<key>.txt on the site (src/lib/indexnow.test.ts keeps the two equal).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke
  cancel-in-progress: true

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: GET ${{ vars.PRODUCTION_URL }}/healthz returns 200 with commit ${{ github.sha }}
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
          WANT: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::warning::PRODUCTION_URL is not set (docs/deploy-cloudflare.md, Setup). Nothing to check."
            exit 0
          fi
          deadline=$((SECONDS + 600))
          while :; do
            body=$(curl --silent --show-error --max-time 20 \
              --write-out '\n%{http_code}' "$BASE/healthz" || true)
            code=${body##*$'\n'}
            json=${body%$'\n'*}
            commit=$(printf '%s' "$json" | jq -r '.commit // "null"' 2>/dev/null || echo "unparsable")
            [ -n "$commit" ] || commit=none
            echo "HTTP $code commit $commit"
            if [ "$code" = 200 ] && [ "$commit" = "$WANT" ]; then
              echo "merge $WANT is live"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::merge $WANT did not reach prod in 10 min: /healthz answers HTTP $code with commit $commit."
              if [ "$code" = 200 ]; then
                echo "::error::Prod is up, on commit $commit. Check the Workers Builds log for $WANT (dashboard › voxford-web › Deployments). A failed build: fix forward or revert. A build that never started: re-run it there. docs/deploy-cloudflare.md, Rollback."
              else
                echo "::error::Prod is not answering 200. Roll back: docs/deploy-cloudflare.md, Rollback."
              fi
              exit 1
            fi
            sleep 15
          done

      - name: IndexNow ping for the changed pages
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
          INDEXNOW_KEY: 29fbaef9d1904408f2349ae2145951a6
          # The merged commit's date; empty on a manual run, which sends every URL.
          SINCE: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || '' }}
        run: |
          case "$BASE" in
            ""|*.workers.dev*) echo "Not the production domain ($BASE): nothing to ping."; exit 0 ;;
          esac
          curl --silent --show-error --fail --max-time 20 "$BASE/sitemap.xml" > sitemap.xml
          python3 - <<'PY' > urls.json
          import json, os, re
          since = os.environ["SINCE"][:10]
          xml = open("sitemap.xml", encoding="utf-8").read()
          urls = []
          for block in re.findall(r"<url>(.*?)</url>", xml, re.S):
              loc = re.search(r"<loc>(.*?)</loc>", block).group(1)
              lastmod = (re.search(r"<lastmod>(.*?)</lastmod>", block) or [None, ""])[1]
              if not since or lastmod[:10] >= since:
                  urls.append(loc)
          print(json.dumps(urls))
          PY
          count=$(jq length urls.json)
          if [ "$count" = 0 ]; then echo "No page changed on ${SINCE:0:10}: nothing to ping."; exit 0; fi
          host=${BASE#https://}; host=${host%%/*}
          jq -n --arg host "$host" --arg key "$INDEXNOW_KEY" --arg loc "$BASE/$INDEXNOW_KEY.txt" \
            --slurpfile urls urls.json '{host: $host, key: $key, keyLocation: $loc, urlList: $urls[0]}' > body.json
          code=$(curl --silent --show-error --max-time 30 --output response.txt --write-out '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json https://api.indexnow.org/indexnow || echo 000)
          echo "IndexNow: HTTP $code for $count URL(s)"; jq -r '.urlList[]' body.json
          case "$code" in
            200|202) ;;
            *) echo "::warning::IndexNow answered HTTP $code: $(head -c 300 response.txt). The deploy is fine; search engines learn of the change on their next crawl." ;;
          esac
